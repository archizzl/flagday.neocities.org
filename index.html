<script>
(function () {
    const STYLE_ID = 'flagday-landing-bg-style';
    function syncBg() {
        let bg = null;
        try { bg = localStorage.getItem('flagday-landing-bg'); } catch (e) {}
        const existing = document.getElementById(STYLE_ID);
        if (!bg) {
            if (existing) existing.remove();
            return;
        }
        const url = `url("${bg.replace(/"/g, '\\"')}")`;
        const fit = `
            background-image: ${url} !important;
            background-size: contain !important;
            background-repeat: no-repeat !important;
            background-position: center center !important;
            background-color: black !important;
        `;
        const css = `
            #homepage-background { ${fit} }
            #homepage-background::before { ${fit} opacity: 1 !important; }
        `;
        if (existing) {
            if (existing.textContent !== css) existing.textContent = css;
            return;
        }
        const style = document.createElement('style');
        style.id = STYLE_ID;
        style.textContent = css;
        document.head.appendChild(style);
    }
    syncBg();
    window.addEventListener('pageshow', syncBg);
    window.addEventListener('storage', (e) => {
        if (e.key === 'flagday-landing-bg' || e.key === null) syncBg();
    });
})();
</script>
